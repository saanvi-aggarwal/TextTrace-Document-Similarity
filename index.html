<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111827' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 7 4 4 20 4 20 7'/><line x1='9' y1='20' x2='15' y2='20'/><line x1='12' y1='4' x2='12' y2='20'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEXTTRACE — Dynamic Programming String Similarity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Global error listener to prevent silent blank screens
      window.addEventListener('error', function(event) {
        console.error('Captured Global Error:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.indexOf('Loading') !== -1)) {
          root.innerHTML = '<div style="padding: 40px; font-family: monospace; max-width: 600px; margin: 40px auto; background: #fff; border: 1px solid #f87171; border-radius: 8px;">' +
            '<h3 style="color: #dc2626; margin-top: 0;">Application Startup Error</h3>' +
            '<p style="color: #4b5563; font-size: 13px;">' + (event.message || event.error) + '</p>' +
            '<button onclick="location.reload()" style="padding: 6px 12px; background: #18181b; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Reload</button>' +
          '</div>';
        }
      });
      // Detect file:/// protocol
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="padding: 40px; font-family: sans-serif; max-width: 640px; margin: 40px auto; background: #fff; border: 1px solid #e5e5e0; border-radius: 8px;">' +
              '<h2 style="margin-top: 0;">Please Open via Localhost URL</h2>' +
              '<p style="color: #52525b;">Modern React applications cannot run over direct <code>file:///</code> paths because browsers block module imports.</p>' +
              '<p>Please access the running platform at: <a href="http://localhost:5173/" style="color: #2563eb; font-weight: bold;">http://localhost:5173/</a></p>' +
            '</div>';
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#FAFAF8] text-[#1A1A1A] antialiased selection:bg-neutral-200 min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 13px; color: #71717a;">
        Initializing TEXTTRACE...
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
